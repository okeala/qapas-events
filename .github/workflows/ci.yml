name: Application checks
on:
  push:
    branches: [master, 'work/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, dom, curl, zip, fileinfo, gd
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --force
      - run: npm ci && npm run build
      - run: node --test scripts/tests/plan-geometry.test.mjs
      - run: php artisan test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: php artisan view:cache && php artisan config:cache
      - run: php artisan route:list --except-vendor
